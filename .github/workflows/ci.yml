name: CI

# Se ejecuta en los PR hacia las ramas protegidas y tambien tras el merge, para
# saber si la rama de integracion quedo en verde y no solo el PR aislado.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Si llegan varios push seguidos a la misma rama, solo interesa el ultimo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura: este workflow no escribe nada en el repositorio.
permissions:
  contents: read

jobs:
  verify:
    name: Lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          # La version sale de .nvmrc, no escrita aqui a mano: asi el runner y
          # las maquinas del equipo no pueden desincronizarse.
          node-version-file: '.nvmrc'
          cache: 'npm'

      # npm ci, no npm install: instala exactamente lo que fija el lockfile y
      # falla si package.json y package-lock.json han divergido.
      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # Si el lint falla, esto sigue ejecutandose: mejor ver los dos informes de
      # una vez que arreglar uno, esperar otra ronda y descubrir el siguiente.
      - name: Build
        if: '!cancelled()'
        run: npm run build

      # El build no necesita las variables de Supabase para compilar, pero sin
      # ellas `import.meta.env.VITE_*` queda en undefined y la app reventaria al
      # arrancar. Este artefacto sirve para inspeccionar el resultado del build,
      # NO para desplegarlo: el job de despliegue debe compilar de nuevo con los
      # secretos inyectados.
      - name: Guardar el build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # La suite de interfaz, contra los adaptadores simulados. Es la que dice que
  # las pantallas hacen lo que dicen; no toca ninguna base.
  interface:
    name: Pruebas de interfaz
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright
        env:
          # La suite entra por el adaptador simulado. Las claves son de forma:
          # `client.ts` exige que existan, y nada las usa con el fake activo.
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: ci-no-se-usa
          VITE_USE_FAKE_AUTH: 'true'
        run: npm run test:e2e
      - name: Guardar los informes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.sha }}
          path: test-results/
          retention-days: 7

  # Las pruebas de CONTRATO: cada adaptador contra una base de verdad, con sus
  # politicas RLS. Levanta Supabase local en el runner -Docker viene de serie-,
  # aplica las migraciones del repositorio y la semilla, y ejecuta Vitest.
  #
  # Es el unico sitio donde una politica que deja ver de mas se detecta antes
  # de produccion.
  contracts:
    name: Pruebas de contrato
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Sin el estudio ni los servicios que no hacen falta para probar la API:
      # arranca antes y consume menos.
      - name: Supabase local
        run: supabase start -x studio,imgproxy,inbucket,logflare,vector,edge-runtime
      - name: Contratos
        run: npm run test:contract
      - name: Parar Supabase
        if: always()
        run: supabase stop --no-backup
