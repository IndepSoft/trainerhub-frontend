<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>TrainerHub</title>
    <meta
      name="description"
      content="Gestiona tus estudiantes, sesiones y progreso como entrenador."
    />

    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Azul primario del tema: tine la barra del navegador y la de estado
         cuando la aplicacion esta instalada. -->
    <meta name="theme-color" content="#0b4bcc" />

    <!-- iOS ignora el manifiesto para esto: necesita sus propias etiquetas
         para abrirse a pantalla completa desde la pantalla de inicio. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TrainerHub" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
