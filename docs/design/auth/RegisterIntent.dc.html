<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #FAF8F5; font-family: 'Barlow', 'Arial Narrow', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #0B4BCC; text-decoration: none; }
    a:hover { color: #0A3FAE; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FAF8F5; display: flex; flex-direction: column;">

  <div style="position: relative; height: 400px; flex-shrink: 0; clip-path: polygon(0 0, 100% 0, 100% 84%, 0 100%); background: #0A1224;">
    <svg viewBox="0 0 390 400" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block;">
      <defs>
        <radialGradient id="glow" cx="0.3" cy="0.34" r="0.64">
          <stop offset="0" stop-color="#3B7BF0" stop-opacity="0.9"></stop>
          <stop offset="0.5" stop-color="#0B4BCC" stop-opacity="0.4"></stop>
          <stop offset="1" stop-color="#0A1224" stop-opacity="0"></stop>
        </radialGradient>
        <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0.35" stop-color="#0A1224" stop-opacity="0"></stop>
          <stop offset="1" stop-color="#0A1224" stop-opacity="0.9"></stop>
        </linearGradient>
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence>
          <feColorMatrix type="saturate" values="0"></feColorMatrix>
        </filter>
      </defs>
      <rect width="390" height="400" fill="#0A1224"></rect>
      <rect width="390" height="400" fill="url(#glow)"></rect>
      <ellipse cx="90" cy="240" rx="180" ry="120" fill="#060B16" opacity="0.92"></ellipse>
      <path d="M0 400 L0 300 C60 250 150 240 250 275 L280 400 Z" fill="#050A14"></path>
      <path d="M120 400 C160 340 230 325 300 340 L350 400 Z" fill="#0E1E42" opacity="0.75"></path>
      <rect width="390" height="400" fill="url(#shade)"></rect>
      <rect width="390" height="400" filter="url(#grain)" opacity="0.14" style="mix-blend-mode: overlay;"></rect>
    </svg>

    <span style="position: absolute; top: 20px; right: 20px; padding: 6px 10px; border-radius: 999px; background: rgba(10, 18, 36, 0.55); color: rgba(250, 248, 245, 0.7); font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;">Foto · sustituir</span>

    <div style="position: absolute; top: 24px; left: 24px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.01em; text-transform: uppercase; color: #FAF8F5;">TrainerHub</div>

    <div style="position: absolute; left: 24px; right: 24px; bottom: 92px; display: flex; flex-direction: column; gap: 12px;">
      <p style="margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: #FF4F1A;">Crear cuenta</p>
      <h1 style="margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 52px; font-weight: 800; line-height: 0.88; letter-spacing: -0.01em; text-transform: uppercase; color: #FAF8F5;">¿Cómo vas<br>a usar<br>TrainerHub?</h1>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; left: -4%; right: -4%; top: 332px; height: 76px; background: #FF4F1A; clip-path: polygon(0 88%, 100% 6%, 100% 20%, 0 100%); pointer-events: none;"></div>

  <!-- Dos opciones, a escuadra. La primera en estado elegido. -->
  <div style="flex: 1; display: flex; flex-direction: column; padding: 28px 24px 24px; gap: 12px;">

    <button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 108px; padding: 20px 22px; box-sizing: border-box; border: 1px solid #0A1224; border-radius: 0; background: #0A1224; color: #FAF8F5; text-align: left; cursor: pointer;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 26px; font-weight: 800; line-height: 1; letter-spacing: -0.01em; text-transform: uppercase;">Entreno a gente</span>
        <span style="font-family: 'Barlow', system-ui, sans-serif; font-size: 14px; line-height: 1.35; color: rgba(250, 248, 245, 0.6);">Monta tu equipo, tus rutinas y tu agenda.</span>
      </div>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF4F1A" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
    </button>

    <button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 108px; padding: 20px 22px; box-sizing: border-box; border: 1px solid rgba(10, 18, 36, 0.24); border-radius: 0; background: transparent; color: #0A1224; text-align: left; cursor: pointer;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 26px; font-weight: 800; line-height: 1; letter-spacing: -0.01em; text-transform: uppercase;">Entreno</span>
        <span style="font-family: 'Barlow', system-ui, sans-serif; font-size: 14px; line-height: 1.35; color: rgba(10, 18, 36, 0.55);">Sigue tu progreso y lo que te asigne tu entrenador.</span>
      </div>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(10, 18, 36, 0.35)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
    </button>

    <p style="margin: auto 0 0; display: flex; justify-content: center; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; color: rgba(10, 18, 36, 0.55);">¿Ya tienes cuenta? <a href="#" style="font-weight: 600; color: #0B4BCC;">Iniciar sesión</a></p>
  </div>
</div>
</x-dc>
</body>
</html>
