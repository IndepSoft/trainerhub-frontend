<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #FAF8F5; font-family: 'Barlow', 'Arial Narrow', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #0B4BCC; text-decoration: none; }
    a:hover { color: #0A3FAE; }
    input::placeholder { color: rgba(10, 18, 36, 0.35); }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FAF8F5; display: flex; flex-direction: column;">

  <!-- Bloque de imagen: a sangre, cortado en diagonal con la cuña de la app -->
  <div style="position: relative; height: 420px; flex-shrink: 0; clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%); background: #0A1224;">
    <svg viewBox="0 0 390 420" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block;">
      <defs>
        <radialGradient id="glow" cx="0.68" cy="0.36" r="0.62">
          <stop offset="0" stop-color="#3B7BF0" stop-opacity="0.9"></stop>
          <stop offset="0.5" stop-color="#0B4BCC" stop-opacity="0.4"></stop>
          <stop offset="1" stop-color="#0A1224" stop-opacity="0"></stop>
        </radialGradient>
        <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0.35" stop-color="#0A1224" stop-opacity="0"></stop>
          <stop offset="1" stop-color="#0A1224" stop-opacity="0.9"></stop>
        </linearGradient>
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence>
          <feColorMatrix type="saturate" values="0"></feColorMatrix>
        </filter>
      </defs>
      <rect width="390" height="420" fill="#0A1224"></rect>
      <rect width="390" height="420" fill="url(#glow)"></rect>
      <ellipse cx="300" cy="245" rx="175" ry="125" fill="#060B16" opacity="0.92"></ellipse>
      <path d="M110 420 C150 300 240 255 340 285 L390 305 L390 420 Z" fill="#050A14"></path>
      <path d="M40 420 C80 355 140 335 205 348 L265 420 Z" fill="#0E1E42" opacity="0.75"></path>
      <rect width="390" height="420" fill="url(#shade)"></rect>
      <rect width="390" height="420" filter="url(#grain)" opacity="0.14" style="mix-blend-mode: overlay;"></rect>
    </svg>

    <span style="position: absolute; top: 20px; right: 20px; padding: 6px 10px; border-radius: 999px; background: rgba(10, 18, 36, 0.55); color: rgba(250, 248, 245, 0.7); font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;">Foto · sustituir</span>

    <!-- Marca -->
    <div style="position: absolute; top: 24px; left: 24px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.01em; text-transform: uppercase; color: #FAF8F5;">TrainerHub</div>

    <!-- Titular sobre la foto -->
    <div style="position: absolute; left: 24px; right: 24px; bottom: 96px; display: flex; flex-direction: column; gap: 12px;">
      <p style="margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: #FF4F1A;">Entra</p>
      <h1 style="margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 52px; font-weight: 800; line-height: 0.88; letter-spacing: -0.01em; text-transform: uppercase; color: #FAF8F5;">Bienvenido<br>de vuelta.</h1>
    </div>
  </div>

  <!-- Banda Ember sobre el filo diagonal -->
  <div aria-hidden="true" style="position: absolute; left: -4%; right: -4%; top: 352px; height: 76px; background: #FF4F1A; clip-path: polygon(0 88%, 100% 6%, 100% 20%, 0 100%); pointer-events: none;"></div>

  <!-- Formulario: líneas, sin tarjeta -->
  <div style="flex: 1; display: flex; flex-direction: column; padding: 28px 24px 24px; gap: 22px;">

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(10, 18, 36, 0.6);">Email</label>
      <input type="email" placeholder="tu@email.com" style="height: 44px; width: 100%; box-sizing: border-box; border: 0; border-bottom: 1px solid rgba(10, 18, 36, 0.22); border-radius: 0; background: transparent; padding: 0; font-family: 'Barlow', system-ui, sans-serif; font-size: 16px; color: #0A1224; outline: none;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px;">
        <label style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(10, 18, 36, 0.6);">Contraseña</label>
        <a href="#" style="font-size: 12px; font-weight: 600; color: #0B4BCC;">¿La olvidaste?</a>
      </div>
      <input type="password" value="••••••••••" style="height: 44px; width: 100%; box-sizing: border-box; border: 0; border-bottom: 1px solid rgba(10, 18, 36, 0.22); border-radius: 0; background: transparent; padding: 0; font-family: 'Barlow', system-ui, sans-serif; font-size: 16px; letter-spacing: 0.12em; color: #0A1224; outline: none;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 8px;">
      <button type="button" style="height: 44px; width: 100%; border: 0; border-radius: 999px; background: #0B4BCC; color: #FFFFFF; font-family: 'Barlow', system-ui, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;">Iniciar sesión</button>
      <p style="margin: 0; display: flex; justify-content: center; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; color: rgba(10, 18, 36, 0.55);">¿No tienes cuenta? <a href="#" style="font-weight: 600; color: #0B4BCC;">Registrarme</a></p>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
